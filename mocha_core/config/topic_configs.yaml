ground_robot:
  - msg_topic: "/ublox/gps/fix"
    msg_type: "sensor_msgs/NavSatFix"
    msg_priority: "HIGH_PRIORITY"
    msg_history: "LAST_MESSAGE"

  - msg_topic: "/orchestrator/status"
    msg_type: "std_msgs/String"
    msg_priority: "HIGH_PRIORITY"
    msg_history: "LAST_MESSAGE"

  - msg_topic: "/person_detections"
    msg_type: "dtc_msgs/PersonDetection"
    msg_priority: "HIGH_PRIORITY"
    msg_history: "ALL_MESSAGES"

aerial_robot:
  - msg_topic: "/ublox/gps/fix"
    msg_type: "sensor_msgs/NavSatFix"
    msg_priority: "HIGH_PRIORITY"
    msg_history: "LAST_MESSAGE"

  - msg_topic: "/scenic/graph"
    msg_type: "std_msgs/String"
    msg_priority: "HIGH_PRIORITY"
    msg_history: "LAST_MESSAGE"

base_station:
