    msg_type: "std_msgs/Header"
    msg_priority: "HIGH_PRIORITY"
    msg_history: "LAST_MESSAGE"

  - msg_topic: "/task_planner/commands"
    msg_type: "std_msgs/String"
    msg_priority: "HIGH_PRIORITY"
    msg_history: "ALL_MESSAGES"

  - msg_topic: "/task_planner/graph"
    msg_type: "std_msgs/String"
